      <button class="btn btn-sm" data-act="reset">全部还原</button>
      <button class="btn btn-sm btn-primary" data-act="commit">保存全部</button>
    </div>
    <div class="card"><div id="cfgList" class="card-bd"></div></div>`;

  /* 配置状态已提升到模块作用域（见文件上方），
     这里只负责初始化与范围切换。 */
  cfgItems = gItems;
  cfgPending = new Map();
  cfgOpenPath = null;

  const loadScope = async (scope, appId) => {
    cfgScopeNow = { scope, appId };
    $("cfgList").innerHTML = '<div class="loading-row"><span class="spinner"></span>载入…</div>';
    collapseCfgRow();
    cfgPending.clear();              // 换范围即丢弃未保存改动，避免写错对象
    updateCfgSaveBar();
    try {
      const q = scope === "bot"
        ? `/api/config/list?scope=bot&app_id=${encodeURIComponent(appId)}`
        : "/api/config/list?scope=global";
      const r = await api(q);
      cfgItems = (r.data && r.data.items) || [];
      $("cfgTitle").textContent = scope === "bot"
        ? `机器人配置 · ${appId}（${cfgItems.length} 项）`
        : `全局配置（${cfgItems.length} 项）`;
      $("cfgKw").value = "";
      renderCfgList("");
    } catch (e) {
      $("cfgList").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  };

  // 侧栏切换 scope
  box.querySelectorAll("[data-cfg-scope]").forEach(el => {
    el.addEventListener("click", () => {
      box.querySelectorAll(".conv").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      // 窄屏：选完范围要把配置内容推上来
      if (S.mobile) {
        $("sidebar").classList.add("hidden");
        $("main").classList.remove("hidden");
        syncChrome();
      }
      loadScope(el.dataset.cfgScope, el.dataset.cfgApp);
    });
  });

  $("cfgTitle").textContent = `全局配置（${cfgItems.length} 项）`;
  renderCfgList("");

  $("cfgKw").addEventListener("input", e => renderCfgList(e.target.value.trim()));
  document.querySelector('[data-act="raw"]').addEventListener("click", async () => {
    try {
      const r = await api("/api/config/get");
      showResult("原始配置（密钥已脱敏）", r.data);
    } catch (e) { toast(e.message, "err"); }
  });
  document.querySelector('[data-act="collapse"]')
    .addEventListener("click", collapseCfgRow);

  // 全部还原：清空待保存改动并重绘
  document.querySelector('[data-act="reset"]').addEventListener("click", () => {
    if (!cfgPending.size) return;
    cfgPending.clear();
    collapseCfgRow();
    renderCfgList($("cfgKw").value.trim());
    toast("已还原全部未保存修改", "ok", 2200);
  });

  // 保存全部：逐项提交，汇总成功/失败，避免一项失败丢掉其它改动
  document.querySelector('[data-act="commit"]').addEventListener("click", async () => {
    if (!cfgPending.size) return;
    const entries = [...cfgPending.entries()];
    let ok = 0; const errs = [];
    const btn = document.querySelector('[data-act="commit"]');
    btn.disabled = true;
    btn.textContent = "保存中…";
    for (const [path, value] of entries) {
      try {
        const r = await api("/api/config/set", {
          method: "POST", body: { path, value }
        });
        const d = r.data || {};
        if (d.errors && d.errors.length) errs.push(path + ": " + d.errors.join("; "));
        else { ok++; cfgPending.delete(path); }
      } catch (e) {
        errs.push(path + ": " + e.message);
      }
    }
    btn.disabled = false;
    btn.textContent = "保存全部";
    if (errs.length) {
      toast(`已保存 ${ok} 项，${errs.length} 项失败：${errs[0]}`, "warn", 6000);
    } else {
      toast(`已保存 ${ok} 项配置`, "ok");
    }
    // 重新拉取，让界面显示服务端真实生效的值
    await loadScope(cfgScopeNow.scope, cfgScopeNow.appId);
  });
}

function fmtVal(v) {
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return "[" + v.map(x => (x && typeof x === "object") ? "…" : String(x)).join(", ") + "]";
  }
  if (v === null || v === undefined) return "";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

/* 数组配置项：逐个元素渲染成小块，保留个数信息。
   密钥数组已由后端脱敏为 ["****",...]，这里只显示个数不显示明文 */
function fmtArrayHTML(it) {
  const v = it.value;
  const isKey = !!it.api_key;
  if (!Array.isArray(v)) return "";
  const n = v.length;
  if (!n) return '<span class="cfg-empty">[] 空数组</span>';
  const chips = v.slice(0, 8).map(x => {
    const s = (x && typeof x === "object") ? "…" : String(x);
    return `<span class="cfg-chip${isKey ? " key" : ""}" title="${esc(s)}">${esc(shortId(s, 26))}</span>`;
  }).join("");
  const more = n > 8 ? `<span class="cfg-chip more">+${n - 8}</span>` : "";
  return `<div class="cfg-arr">${chips}${more}</div>
    <div class="cfg-hint">共 ${n} 个元素${isKey ? "（密钥已脱敏，不回显）" : ""}</div>`;
}

/* 配置行 + 紧随其后的行内编辑面板。
   两者成对出现：点行展开编辑面板，再点行（或取消）收起。 */
function cfgRowHTML(it) {
  const p = it.path || "";
  const t = it.type || "str";
  const ro = !!it.readonly || !!it.sensitive;
  const isKey = !!it.api_key;
  const v = it.value;

  let badge;
  if (it.sensitive) badge = '<span class="badge badge-err">凭证只读</span>';
  else if (it.readonly) badge = '<span class="badge badge-warn">只读</span>';
  else if (isKey) badge = '<span class="badge badge-mute">密钥</span>';
  else if (t === "int") badge = '<span class="badge badge-info">整数</span>';
  else if (t === "bool") badge = '<span class="badge badge-info">开关</span>';
  else if (t === "list") badge = '<span class="badge badge-brand">数组</span>';
  else if (t === "dict") badge = '<span class="badge badge-brand">对象</span>';
  else badge = '<span class="badge">文本</span>';

  // 值展示：凭证打码；数组逐项；其余原样
  let shown;
  if (it.sensitive) {
    shown = '<span class="cfg-mask mono">****（已脱敏）</span>';
  } else if (t === "list") {
    shown = fmtArrayHTML(it);
  } else if (t === "dict") {
    shown = `<span class="cfg-obj mono">{${esc(Object.keys(v || {}).join(", "))}}</span>`;
  } else if (t === "bool") {
    shown = `<span class="cfg-val">${v ? "开启" : "关闭"}</span>`;
  } else {
    shown = `<span class="cfg-val">${esc(fmtVal(v))}</span>`;
  }

  // 机器人配置只显示字段名（去掉 bots.N. 前缀），完整路径放在 title
  const short = p.replace(/^bots\.\d+\./, "");
  const pe = attrEncode(p);

  return `<div class="cfg-row${ro ? " ro" : ""}" data-path="${pe}"
      data-type="${esc(t)}" data-ro="${ro ? 1 : 0}"
      title="${ro ? "只读项" : "点击编辑"}">
    <div class="cfg-k mono">
      <span class="cfg-caret">▶</span>
      <span title="${esc(p)}">${esc(short)}</span>
    </div>
    <div class="cfg-v">${shown}</div>
    <div class="cfg-badges">
      <span class="cfg-dirty">● 已改</span>
      ${badge}
    </div>
  </div>
  ${ro ? cfgReadonlyPanelHTML(it, pe) : cfgEditPanelHTML(it, pe)}`;
}

/* 只读项被点开时，给一句解释而不是空白 */
function cfgReadonlyPanelHTML(it, pe) {
  const why = it.sensitive
    ? "出于安全考虑，该凭证不支持在管理台修改。"
    : "该项为只读，由服务端管理，无法在此修改。";
  return `<div class="cfg-edit-ro" data-path="${pe}">
    🔒 ${why}
  </div>`;
}

/* 行内编辑面板：按类型给出最合适的控件。
   数组 / 对象不再要求手写 JSON，改为逐行增删。 */
function cfgEditPanelHTML(it, pe) {
  const t = it.type || "str";
  const isKey = !!it.api_key;
  let body;

  if (isKey) {
    body = `<textarea class="inp mono" data-role="val" rows="4"
        placeholder="每行一个密钥"></textarea>
      <div class="cfg-edit-tip">
        出于安全考虑，密钥不会回显。填写新值将<b>覆盖</b>原密钥列表；留空则取消。</div>`;
  } else if (t === "bool") {
    body = `<label class="cfg-switch">
        <input type="checkbox" data-role="val"${it.value ? " checked" : ""}>
        <span class="cfg-switch-track"></span>
        <span data-role="booltxt">${it.value ? "开启" : "关闭"}</span>
      </label>`;
  } else if (t === "int" || t === "float") {
    body = `<input class="inp mono" data-role="val" type="number"
      inputmode="decimal" value="${esc(it.value)}"
      step="${t === "float" ? "any" : "1"}">`;
  } else if (t === "list") {
    const arr = Array.isArray(it.value) ? it.value : [];
    body = `<div class="cfg-list-editor" data-role="list">
        ${arr.map(x => cfgListRowHTML(x)).join("")}
      </div>
      <div class="cfg-add-row" data-role="add">＋ 添加一项</div>
      <div class="cfg-edit-tip">共 <span data-role="count">${arr.length}</span> 项，
        可逐项修改或删除。</div>`;
  } else if (t === "dict") {
    const obj = (it.value && typeof it.value === "object") ? it.value : {};
    const keys = Object.keys(obj);
    body = keys.length
      ? `<div class="cfg-list-editor" data-role="dict">
          ${keys.map(k => `<div class="cfg-list-item" data-key="${esc(k)}">
            <span class="cfg-k mono" style="flex:none;min-width:96px">${esc(k)}</span>
            <input class="inp mono" data-role="dictval"
              value="${esc(typeof obj[k] === "object" ? JSON.stringify(obj[k]) : String(obj[k]))}">
          </div>`).join("")}
        </div>
        <div class="cfg-edit-tip">对象字段按值修改；嵌套结构请用 JSON 文本。</div>`
      : `<div class="cfg-empty">空对象 {}，暂无可编辑字段</div>`;
  } else {
    body = `<input class="inp mono" data-role="val" value="${esc(it.value == null ? "" : it.value)}">`;
  }

  return `<div class="cfg-edit" data-path="${pe}" data-type="${esc(t)}">
    <div class="cfg-edit-head">
      <span class="cfg-edit-path">${esc(it.path)}</span>
    </div>
    <div class="cfg-edit-body">${body}</div>
    <div class="cfg-edit-foot">
      <button class="btn btn-sm" data-role="cancel">取消</button>
      <div class="spacer"></div>
      <button class="btn btn-sm btn-primary" data-role="save">保存此项</button>
    </div>
  </div>`;
}

/* 数组里的一行：输入框 + 删除按钮 */
function cfgListRowHTML(x) {
  const s = (x && typeof x === "object") ? JSON.stringify(x) : String(x == null ? "" : x);
  return `<div class="cfg-list-item">
    <input class="inp mono" data-role="item" value="${esc(s)}">
    <button class="cfg-mini del" data-role="delitem" title="删除该项">✕</button>
  </div>`;
}

/* CSS 属性选择器里的值需要转义，否则含引号/反斜杠的路径会选不中 */
function cssEsc(s) {
  return String(s).replace(/["\\]/g, "\\$&");
}

/* 绑定每一行的展开 / 收起，以及编辑面板内的操作 */
function bindCfgRows() {
  // 点击整行切换展开状态（点编辑面板内部不触发）
  document.querySelectorAll(".cfg-row").forEach(row => {
    row.addEventListener("click", () => {
      const path = attrDecode(row.dataset.path);
      if (row.classList.contains("open")) collapseCfgRow();
      else expandCfgRow(row, path);
    });
  });

  document.querySelectorAll(".cfg-edit").forEach(panel => {
    const path = attrDecode(panel.dataset.path);
    const it = cfgItems.find(x => x.path === path);
    if (!it) return;

    // 阻止面板内点击冒泡到行，否则输入时会反复收起
    panel.addEventListener("click", e => e.stopPropagation());

    const cancel = panel.querySelector('[data-role="cancel"]');
    if (cancel) cancel.addEventListener("click", collapseCfgRow);

    const save = panel.querySelector('[data-role="save"]');
    if (save) save.addEventListener("click", () => saveCfgItem(panel, it));

    // 布尔开关：切换时同步文字，并即时记录改动（无需再点保存）
    const chk = panel.querySelector('input[type="checkbox"][data-role="val"]');
    if (chk) {
      chk.addEventListener("change", () => {
        const txt = panel.querySelector('[data-role="booltxt"]');
        if (txt) txt.textContent = chk.checked ? "开启" : "关闭";
        pendingSet(path, chk.checked);
        markDirty(path, true);
        updateCfgSaveBar();
      });
    }

    // 数组：添加 / 删除元素
    const listBox = panel.querySelector('[data-role="list"]');
    const addBtn = panel.querySelector('[data-role="add"]');
    if (addBtn && listBox) {
      addBtn.addEventListener("click", () => {
        listBox.insertAdjacentHTML("beforeend", cfgListRowHTML(""));
        bindListDeletes(panel);
        syncListCount(panel);
        const inputs = listBox.querySelectorAll('[data-role="item"]');
        const last = inputs[inputs.length - 1];
        if (last && !isMobileNow()) last.focus();
      });
      bindListDeletes(panel);
    }
  });
}

/* 数组项删除按钮：新增元素后要重新绑定 */
function bindListDeletes(panel) {
  panel.querySelectorAll('[data-role="delitem"]').forEach(b => {
    if (b.dataset.bound) return;
    b.dataset.bound = "1";
    b.addEventListener("click", () => {
      const item = b.closest(".cfg-list-item");
      if (item) item.remove();
      syncListCount(panel);
    });
  });
}

function syncListCount(panel) {
  const box = panel.querySelector('[data-role="list"]');
  const c = panel.querySelector('[data-role="count"]');
  if (box && c) c.textContent = box.querySelectorAll('[data-role="item"]').length;
}

/* 标记某行「已改」，让用户在长列表里也能一眼看到动过哪些 */
function markDirty(path, on) {
  const row = document.querySelector(`.cfg-row[data-path="${cssEsc(path)}"]`);
  if (row) row.classList.toggle("dirty", on);
}

/* 读取编辑面板里的值，按类型转换。
   返回 {ok:true,value} 或 {ok:false,msg}，由调用方决定是否提示。 */
function readCfgValue(panel, it) {
  const t = it.type || "str";

  if (it.api_key) {
    const raw = panel.querySelector('[data-role="val"]').value;
    const lines = raw.split("\n").map(s => s.trim()).filter(Boolean);
    if (!lines.length) return { ok: false, msg: "未填写新密钥" };
    return { ok: true, value: lines };
  }
  if (t === "bool") {
    const c = panel.querySelector('input[type="checkbox"][data-role="val"]');
    return { ok: true, value: !!c.checked };
  }
  if (t === "int") {
    const raw = panel.querySelector('[data-role="val"]').value.trim();
    const n = parseInt(raw, 10);
    if (raw === "" || isNaN(n)) return { ok: false, msg: "必须是整数" };
    return { ok: true, value: n };
  }
  if (t === "float") {
    const raw = panel.querySelector('[data-role="val"]').value.trim();
    const n = parseFloat(raw);
    if (raw === "" || isNaN(n)) return { ok: false, msg: "必须是数字" };
    return { ok: true, value: n };
  }
  if (t === "list") {
    const inputs = [...panel.querySelectorAll('[data-role="item"]')];
    return { ok: true, value: inputs.map(i => i.value) };
  }
  if (t === "dict") {
    const rows = [...panel.querySelectorAll('[data-role="dict"] .cfg-list-item')];
    const obj = {};
    for (const r of rows) {
      const k = r.dataset.key;
      const raw = r.querySelector('[data-role="dictval"]').value;
      // 原值是对象/数组的字段按 JSON 解析，解析失败则保留原样文本
      const orig = (it.value || {})[k];
      if (orig !== null && typeof orig === "object") {
        try { obj[k] = JSON.parse(raw); }
        catch { return { ok: false, msg: `字段 ${k} 的 JSON 格式错误` }; }
      } else if (typeof orig === "number") {
        const n = Number(raw);
        if (isNaN(n)) return { ok: false, msg: `字段 ${k} 必须是数字` };
        obj[k] = n;
      } else if (typeof orig === "boolean") {
        obj[k] = raw === "true";
      } else {
        obj[k] = raw;
      }
    }
    return { ok: true, value: obj };
  }
  return { ok: true, value: panel.querySelector('[data-role="val"]').value };
}

/* 保存单项：立即提交该配置项 */
async function saveCfgItem(panel, it) {
  const r = readCfgValue(panel, it);
  if (!r.ok) { toast(r.msg, "warn"); return; }
  const btn = panel.querySelector('[data-role="save"]');
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const res = await api("/api/config/set", {
      method: "POST", body: { path: it.path, value: r.value }
    });
    const d = res.data || {};
    if (d.errors && d.errors.length) {
      toast("保存失败：" + d.errors.join("; "), "warn", 5000);
    } else {
      toast("已保存", "ok", 2000);
      pendingDelete(it.path);
      markDirty(it.path, false);
      updateCfgSaveBar();
      // 更新本地缓存，收起后列表显示新值
      it.value = r.value;
      updateRowValue(it);
      collapseCfgRow();
    }
  } catch (e) {
    toast("保存失败：" + e.message, "err");
  }
  btn.disabled = false; btn.textContent = "保存此项";
}

/* 只更新某一行的值显示，避免整表重绘导致闪烁与位置跳动 */
function updateRowValue(it) {
  const row = document.querySelector(`.cfg-row[data-path="${cssEsc(it.path)}"]`);
  if (!row) return;
  const vBox = row.querySelector(".cfg-v");
  if (!vBox) return;
  const t = it.type || "str";
  if (t === "list") vBox.innerHTML = fmtArrayHTML(it);
  else if (t === "dict") {
    vBox.innerHTML =
      `<span class="cfg-obj mono">{${esc(Object.keys(it.value || {}).join(", "))}}</span>`;
  } else if (t === "bool") {
    vBox.innerHTML = `<span class="cfg-val">${it.value ? "开启" : "关闭"}</span>`;
  } else {
    vBox.innerHTML = `<span class="cfg-val">${esc(fmtVal(it.value))}</span>`;
  }
}

/* 3.0 起配置项改为行内编辑（见 cfgEditPanelHTML / saveCfgItem），
   原来的模态框编辑已移除：每改一项都要开关弹窗、丢失列表位置，
   手机上弹窗还会盖住整个配置列表。 */

/* ============================================================
   11b. 任务筛选（推送 / 唤醒）
   ============================================================ */
function taskFilterBarHTML(kind) {
  const f = S.taskFilter[kind];
  // 只列出后端真实会产生的状态，与 TASK_STATUS_LABELS 同序；
  // 数量取自后端 meta.counts，键已保证与这里一一对应
  const statusTabs = [
    ["", "全部"], ["pending", "未开始"],
    ["completed", "执行完成"], ["failed", "执行失败"]
  ].map(([v, label]) => {
    const c = S.taskCounts[kind];
    const n = c ? (v ? (c[v] || 0) : (c.total || 0)) : null;
    return `<button class="tf-tab${f.status === v ? " on" : ""}" data-tf-status="${v}">${label}${
      n === null ? "" : ` <span class="tf-num">${n}</span>`}</button>`;
  }).join("");

  return `<div class="task-filter" id="tfBar-${kind}">
    <div class="tf-row tf-tabs">${statusTabs}</div>
    <div class="tf-row">
      <input class="tf-kw" id="tfKw-${kind}" placeholder="关键词（逗号分隔，默认任一命中）"
        value="${esc(f.keywords)}">
      <label class="tf-chk" title="勾选后需同时包含全部关键词">
        <input type="checkbox" id="tfAll-${kind}"${f.matchAll ? " checked" : ""}>全部命中</label>
      <button class="tf-btn" id="tfGo-${kind}">筛选</button>
      <button class="tf-btn ghost" id="tfClear-${kind}">清空</button>
    </div>
    <div class="tf-row tf-times">
      <span class="tf-lbl">时间</span>
      <input class="tf-date" id="tfStart-${kind}" type="date" value="${esc(f.start || "")}">
      <span class="tf-lbl">至</span>
      <input class="tf-date" id="tfEnd-${kind}" type="date" value="${esc(f.end || "")}">
      <select class="tf-sel" id="tfOrder-${kind}">
        <option value=""${f.order === "" ? " selected" : ""}>默认排序</option>
        <option value="desc"${f.order === "desc" ? " selected" : ""}>时间倒序</option>
        <option value="asc"${f.order === "asc" ? " selected" : ""}>时间正序</option>
      </select>
    </div>
  </div>`;
}

/* 任务列表筛选参数 → 查询串。
   返回不带前导 & 的纯查询串（可能为空），由调用方决定前面接 ? 还是 & */
function taskQueryString(kind) {
  const f = S.taskFilter[kind];
  const p = new URLSearchParams();
  if (f.status) p.set("status", f.status);
  if (f.keywords) p.set("keywords", f.keywords);
  if (f.matchAll) p.set("match_all", "1");
  if (f.start) p.set("start", f.start);
  if (f.end) p.set("end", f.end);
  if (f.order) p.set("order", f.order);
  return p.toString();
}

function applyTaskFilter(kind) {
  const f = S.taskFilter[kind];
  f.keywords = ($("tfKw-" + kind).value || "").trim();
  f.matchAll = !!$("tfAll-" + kind).checked;
  f.start = ($("tfStart-" + kind).value || "").trim();
  f.end = ($("tfEnd-" + kind).value || "").trim();
  f.order = $("tfOrder-" + kind).value;
  loadTaskPane(kind, { silent: true });
}

function bindTaskFilterBar(kind) {
  const f = S.taskFilter[kind];
  const bar = $("tfBar-" + kind);
  if (!bar) return;

  bar.querySelectorAll("[data-tf-status]").forEach(btn => {
    btn.addEventListener("click", () => {
      f.status = btn.dataset.tfStatus;
      // 只切换高亮，随后重建列表（避免整条重新渲染导致输入丢失）
      bar.querySelectorAll("[data-tf-status]").forEach(b =>
        b.classList.toggle("on", b.dataset.tfStatus === f.status));
      loadTaskPane(kind, { silent: true });
    });
  });

  const kw = $("tfKw-" + kind);
  if (kw) kw.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); applyTaskFilter(kind); }
  });
  const go = $("tfGo-" + kind);
  if (go) go.addEventListener("click", () => applyTaskFilter(kind));
  const cl = $("tfClear-" + kind);
  if (cl) cl.addEventListener("click", () => {
    S.taskFilter[kind] = { status: "", keywords: "", matchAll: false, start: "", end: "", order: "" };
    loadTaskPane(kind, { silent: true });
  });
}

}

function toggleWakeIso() {
  if (!S.wakeMode) return;
  S.wakeIso = !S.wakeIso;
  syncComposerUI();
}

function autoGrow(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 180) + "px";
}

async function sendText() {
  const ta = $("taMsg");
  const content = ta.value.trim();
  if (!content || !S.conv) return;

  // 唤醒模式：内容作为提示词注入，不真正发消息
  if (S.wakeMode) { await doWakeup(content); return; }

  const btn = $("btnSend");
  btn.disabled = true;
  const old = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const body = {
      target_type: S.conv.type, target_id: S.conv.id,
      app_id: S.botId || undefined
    };
    if (S.mdMode) {
      body.message_type = "markdown";
      body.markdown = content;
      body.content = content;
    } else {
      body.content = content;
    }
    await api("/api/send", { method: "POST", body });
    ta.value = "";
    autoGrow(ta);
    toast(S.mdMode ? "Markdown 发送成功" : "发送成功", "ok", 1800);
    await loadHistory(true);   // 静默刷新
  } catch (e) {
    toast("发送失败：" + e.message, "err", 5000);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
    syncComposerUI();
  }
}

async function doWakeup(prompt) {
  if (!S.conv) return;
  const btn = $("btnSend");
  btn.disabled = true;
  const old = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    await api("/api/wakeup/trigger", {
      method: "POST",
      body: {
        target_type: S.conv.type, target_id: S.conv.id, description: prompt,
        isolation_mode: S.wakeIso ? 1 : 0,
        app_id: S.botId || undefined
      }
    });
    $("taMsg").value = "";
    autoGrow($("taMsg"));
    toast("已唤醒" + (S.wakeIso ? "（隔离模式）" : "") + "，AI 正在回复…", "ok", 3000);
    // 唤醒是异步的，稍等再刷新
    setTimeout(() => { if (S.conv) loadHistory(true); }, 1200);
  } catch (e) {
    toast("唤醒失败：" + e.message, "err", 6000);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
    syncComposerUI();
  }
}

/* ============================================================
   11e. 群信息（合并 bot_state + mute_status）
   ============================================================ */
async function openGroupInfo() {
  const c = S.conv;
  if (!c || c.type !== "group") return;
  const gid = c.id;

  openModal("群信息 · " + c.name,
    '<div class="loading-row"><span class="spinner"></span>正在获取群信息…</div>', null, "关闭");

  const [rst, rmu] = await Promise.allSettled([
    api(withBot(`/api/bot_state?target_id=${encodeURIComponent(gid)}`)),
    api(withBot(`/api/mute/status?target_id=${encodeURIComponent(gid)}`))
  ]);
  if (S.conv !== c) return;   // 期间切换了会话

  const st = rst.status === "fulfilled" ? (rst.value.data || {}) : null;
  const mu = rmu.status === "fulfilled" ? (rmu.value.data || {}) : null;
  const stErr = rst.status === "rejected" ? (rst.reason.message || "未知错误") : "";
  const muErr = rmu.status === "rejected" ? (rmu.reason.message || "未知错误") : "";

  const roleMap = { member: "普通成员", admin: "管理员", owner: "群主" };
  const role = (st && st.member_role) || "";
  const roleTxt = roleMap[role] || role || "未知";
  const roleCls = { admin: "badge-ok", owner: "badge-brand", member: "badge-warn" }[role] || "";

  const row = (k, v, mono) =>
    `<div class="gi-row"><span class="gi-k">${esc(k)}</span>
      <span class="gi-v${mono ? " mono" : ""}">${v}</span></div>`;

  let html = `<div class="gi-head">
    <div class="gi-avatar" style="background:${colorOf(gid)}">${esc(initialOf(c.name, gid))}</div>
    <div style="min-width:0">
      <div class="gi-name">${esc(c.name)}</div>
      <div class="gi-id">${esc(gid)}</div>
    </div>
  </div>`;

  html += '<div class="gi-box">';
  if (st) {
    html += row("机器人角色", `<span class="badge ${roleCls}">${esc(roleTxt)}</span>`);
    html += row("群名称", esc(st.group_name || c.name));
    html += row("群 ID", esc(gid), true);
  } else {
    html += `<div class="gi-err">权限查询失败：${esc(stErr)}</div>`;
  }
  html += "</div>";

  // 能力提示
  if (st) {
    html += `<div class="gi-muted">${role === "member"
      ? "⚠️ 机器人是普通成员，只能撤回自己 2 分钟内发送的消息。"
      : "✅ 机器人是管理员/群主，可撤回任意成员的消息且无时间限制。"}</div>`;
  }

  // 禁言状态
  html += '<div class="gi-muted-t">禁言状态</div>';
  if (mu) {
    const muted = mu.muted_members || mu.members || [];
    if (!muted.length) {
      html += '<div class="gi-muted">当前无禁言中的成员</div>';
    } else {
      html += muted.map(m => `<div class="gi-muted-item">
        <span class="mono" style="font-size:12px">${esc(m.member_id || m.id || "?")}</span>
        <span style="font-size:11.5px;color:var(--ink-3)">
          ${esc(fmtExpire(m.mute_expire_at || m.expire_at))}</span>
      </div>`).join("");
    }
  } else {
    html += `<div class="gi-err">禁言状态查询失败：${esc(muErr)}</div>`;
  }

  // 成员列表
  const mem = c.members || [];
  html += `<div class="gi-muted-t">成员（${mem.length}）</div>`;
  html += mem.length
    ? `<div class="row row-wrap" style="gap:6px">${mem.slice(0, 100).map(m =>
        `<div class="row" style="gap:6px;padding:5px 10px;border-radius:999px;
          background:var(--stroke);border:1px solid var(--stroke)">
          <span style="font-size:12px">${esc(m.member_name || shortId(m.member_id, 10))}</span>
        </div>`).join("")}</div>`
    : '<div class="gi-muted">暂无成员记录</div>';

  $("mBody").innerHTML = html;
}

/* ============================================================
   12.5 记忆管理视图
   对应后端 /api/memory/*（与机器人工具 view/add/modify/delete/
   enable/disable/search_memory 共用同一套底层函数）。

   四个层级的 identifier 含义不同：
     global / bot        → 机器人 APP_ID
     group               → 群 openid
     c2c                 → 用户 openid
   顶层「全局密钥可跨机器人」而「机器人密钥只能操作自己」的限制由后端判定，
   这里只负责把参数传对、把结果显示清楚。
   ============================================================ */

const MEM_LEVELS = [
  { v: "global", label: "全局记忆", ico: "🌐", hint: "该机器人所有会话共享" },
  { v: "bot",    label: "机器人记忆", ico: "🤖", hint: "仅该机器人自己的记忆" },
  { v: "group",  label: "群聊记忆", ico: "👥", hint: "按群隔离" },
  { v: "c2c",    label: "私聊记忆", ico: "💬", hint: "按用户隔离" }
];

function memLevelMeta(v) {
  return MEM_LEVELS.find(x => x.v === v) || MEM_LEVELS[0];
}

/* identifier 以「昵称 + ID」显示时更容易认人；
   名称表来自会话列表已加载的 nameMap，取不到就只显示 ID。 */
function memTargetLabel(level, id) {
  const nm = S.nameMap && S.nameMap[id];
  const short = shortId(id, 22);
  if (nm && nm !== id) return `${nm}（${short}）`;
  return short;
}

/* 拉取各层级的可选目标（群/用户），用于下拉选择。

   缓存按「服务器 + 机器人」作键：群/用户列表是 app_id 维度的数据，
   换机器人（或换服务器）后必须重新拉，否则下拉里还停在上一个机器人
   的目标上，选出来的 openid 会张冠李戴。
   用键而不是「切机器人时手动清空」：任何漏掉的清理路径都会重新引入
   这个 bug，按数据归属做键则天然不可能读到别人的缓存。 */
function memTargetsKey() {
  return normBase(S.base) + "|" + (S.botId || "");
}

async function loadMemTargets() {
  const key = memTargetsKey();
  if (!S.memMaps || S.memMaps.key !== key) {
    const maps = { key, group: [], c2c: [] };
    try {
      const [rg, ru] = await Promise.all([
        api(withBot("/api/groups")).catch(() => null),
        api(withBot("/api/users")).catch(() => null)
      ]);
      if (rg && rg.data) maps.group = rg.data.groups || [];
      if (ru && ru.data) maps.c2c = ru.data.users || [];
    } catch (e) {
      // 拿不到列表不致命：仍允许手工输入 openid
    }
    // 请求期间又换了机器人：这份结果已不属于当前目标，直接丢弃，
    // 否则后发的请求会被先发的覆盖（竞态）。
    if (memTargetsKey() !== key) return loadMemTargets();
    S.memMaps = maps;
  }
  return S.memMaps;
}

/* 切机器人/服务器时把记忆视图的选择状态也清掉：
   上一个机器人的 group/c2c openid 对新机器人毫无意义，
   留着会让「查看记忆」直接去查一个不属于当前机器人的目标。 */
function resetMemSelection() {
  S.memMaps = null;
  S.memIdent = "";
  S.memKeyword = "";
}

/* 记忆视图的 identifier：global/bot 用当前选中的机器人；
   group/c2c 用下拉或手工输入的 openid。 */
function memIdentOf(level) {
  if (level === "global" || level === "bot") return S.botId || "";
  return S.memIdent || "";
}

async function loadMemoryPane() {
  const body = $("mainBody");
  const box = $("sideBody");
  body.innerHTML = '<div class="loading-row"><span class="spinner"></span>载入记忆…</div>';
  box.innerHTML = "";

  if (!ensureBot()) {
    body.innerHTML = '<div class="empty"><div class="empty-ico">🤖</div>尚未配置机器人</div>';
    return;
  }

  // 侧栏：层级选择器（与 机器人/配置 视图的选择器同构）
  box.innerHTML = MEM_LEVELS.map(l => `
    <div class="conv${l.v === S.memLevel ? " active" : ""}" data-mem-level="${l.v}">
      <div class="avatar" style="background:var(--brand)">${l.ico}</div>
      <div class="conv-main">
        <div class="conv-name">${esc(l.label)}</div>
        <div class="conv-sub">${esc(l.hint)}</div>
      </div>
    </div>`).join("");

  body.innerHTML = `
    <div class="mem-tabs" id="memTabs"></div>
    <div class="mem-target" id="memTarget"></div>
    <div class="card">
      <div class="card-hd">
        <span id="memCount" style="font-size:12.5px;color:var(--ink-3)"></span>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-mem="search">🔍 跨层搜索</button>
        <button class="btn btn-sm" data-mem="batch">批量添加</button>
        <button class="btn btn-sm btn-primary" data-mem="add">＋ 添加记忆</button>
      </div>
      <div class="card-bd">
        <div class="mem-bar">
          <input id="memKw" class="inp" type="search" enterkeyhint="search"
            placeholder="在当前层级中筛选…" autocomplete="off">
          <span class="mem-badge" id="memState"></span>
          <div class="spacer"></div>
          <button class="btn btn-sm" data-mem="toggle" id="memToggle">启用/禁用</button>
        </div>
        <div id="memList"></div>
      </div>
    </div>`;

  // 层级切换
  const renderTabs = () => {
    $("memTabs").innerHTML = MEM_LEVELS.map(l =>
      `<button class="mem-tab${l.v === S.memLevel ? " on" : ""}"
        data-mem-tab="${l.v}">${l.ico} ${esc(l.label)}</button>`).join("");
  };
  renderTabs();

  // 目标选择区：global/bot 显示机器人；group/c2c 显示下拉 + 手工输入
  const renderTarget = async () => {
    const lv = S.memLevel;
    const wrap = $("memTarget");
    if (lv === "global" || lv === "bot") {
      const b = (S.bots || []).find(x => x.app_id === S.botId);
      wrap.innerHTML = `<span class="mem-badge">🤖 ${esc(b ? (b.desc || b.app_id) : S.botId)}</span>
        <span style="font-size:11.5px;color:var(--ink-3)">
          标识符即当前机器人 APP_ID</span>`;
      return;
    }
    const maps = await loadMemTargets();
    const list = lv === "group" ? maps.group : maps.c2c;
    const cur = S.memIdent || "";
    const opts = list.map(g => {
      const id = g.group_id || g.user_id || g.id || "";
      const nm = g.group_name || g.user_name || g.name || "";
      return `<option value="${attrEncode(id)}"${id === cur ? " selected" : ""}>${
        esc(nm ? nm + "（" + shortId(id, 18) + "）" : shortId(id, 26))}</option>`;
    }).join("");
    wrap.innerHTML = `
      <select class="inp" id="memSel">
        <option value="">— 选择${lv === "group" ? "群" : "用户"} —</option>
        ${opts}
        ${cur && !list.some(g => (g.group_id || g.user_id || g.id) === cur)
          ? `<option value="${attrEncode(cur)}" selected>${esc(shortId(cur, 26))}（手工输入）</option>` : ""}
      </select>
      <input id="memManual" class="inp mono" placeholder="或直接输入 ${lv === "group" ? "群" : "用户"} openid"
        value="${esc(cur && !list.some(g => (g.group_id || g.user_id || g.id) === cur) ? cur : "")}">
      <button class="btn btn-sm" data-mem="manual">使用</button>`;

    $("memSel").addEventListener("change", e => {
      S.memIdent = attrDecode(e.target.value);
      $("memManual").value = "";
      loadMemList();
    });
    $("memManual").addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); $("memTarget").querySelector('[data-mem="manual"]').click(); }
    });
    wrap.querySelector('[data-mem="manual"]').addEventListener("click", () => {
      const v = $("memManual").value.trim();
      if (!v) { toast("请先输入 openid", "warn"); return; }
      S.memIdent = v;
      loadMemList();
    });
  };

  // 侧栏点击切层级
  box.querySelectorAll("[data-mem-level]").forEach(el => {
    el.addEventListener("click", async () => {
      box.querySelectorAll(".conv").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      S.memLevel = el.dataset.memLevel;
      S.memKeyword = "";
      $("memKw").value = "";
      renderTabs();
      await renderTarget();
      // 窄屏：侧栏是选择器，选完要把内容推上来
      if (S.mobile) {
        $("sidebar").classList.add("hidden");
        $("main").classList.remove("hidden");
        syncChrome();
      }
      loadMemList();
    });
  });

  // 顶部层级切换同样处理（点 tabs 等价于点侧栏）
  $("memTabs").addEventListener("click", e => {
    const b = e.target.closest("[data-mem-tab]");
    if (!b) return;
    const lv = b.dataset.memTab;
    if (lv === S.memLevel) return;
    box.querySelector(`[data-mem-level="${lv}"]`)?.click();
  });

  $("memKw").addEventListener("input", e => {
    S.memKeyword = e.target.value.trim();
    renderMemList(window.__memItems || [], window.__memEnabled);
  });

  // 卡片头与工具条按钮
  body.querySelectorAll("[data-mem]").forEach(b => {
    b.addEventListener("click", async () => {
      const a = b.dataset.mem;
      if (a === "add") openMemAdd();
      else if (a === "batch") openMemBatch();
      else if (a === "search") openMemSearch();
      else if (a === "toggle") toggleMemLevel();
    });
  });

  await renderTarget();
  await loadMemList();
}

/* 拉取当前层级的记忆并渲染 */
async function loadMemList() {
  const listBox = $("memList");
  const lv = S.memLevel;
  const ident = memIdentOf(lv);

  if (!ident) {
    listBox.innerHTML = `<div class="empty"><div class="empty-ico">👇</div>
      请先选择${lv === "group" ? "群" : "用户"}<br>
      <span style="font-size:11.5px">记忆按${lv === "group" ? "群" : "用户"}隔离，需要指定目标</span></div>`;
    $("memCount").textContent = "";
    $("memState").textContent = "";
    $("memState").className = "mem-badge off";
    window.__memItems = [];
    return;
  }

  listBox.innerHTML = '<div class="loading-row"><span class="spinner"></span>载入…</div>';
  try {
    const q = `/api/memory/list?level=${encodeURIComponent(lv)}&identifier=${encodeURIComponent(ident)}`;
    const r = await api(withBot(q));
    const d = r.data || {};
    window.__memItems = d.items || [];
    window.__memEnabled = !!d.enabled;
    $("memCount").textContent =
      `${memLevelMeta(lv).label} · ${memTargetLabel(lv, ident)} · 共 ${d.total || 0} 条`;
    $("memState").textContent = d.enabled ? "已启用" : "已禁用";
    $("memState").className = "mem-badge" + (d.enabled ? "" : " off");
    $("memToggle").textContent = d.enabled ? "禁用" : "启用";
    renderMemList(window.__memItems, d.enabled);
  } catch (e) {
    listBox.innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div>
      ${esc(e.message)}</div>`;
    $("memCount").textContent = "";
    $("memState").textContent = "";
    window.__memItems = [];
  }
}

/* 渲染条目列表；带关键词时高亮命中片段。
   索引一律用后端返回的 index（即数组下标），编辑/删除都按它定位，
   本地筛选不会改变索引，避免「筛选后删错条目」。 */
function renderMemList(items, enabled) {
  const box = $("memList");
  const kw = (S.memKeyword || "").toLowerCase();
  const shown = kw
    ? items.filter(it => String(it.content || "").toLowerCase().includes(kw))
    : items;

  if (!items.length) {
    box.innerHTML = `<div class="empty"><div class="empty-ico">🧠</div>该层级暂无记忆<br>
      <span style="font-size:11.5px">点右上角「＋ 添加记忆」写入第一条</span></div>`;
    return;
  }
  if (!shown.length) {
    box.innerHTML = `<div class="empty"><div class="empty-ico">🔍</div>
      没有匹配「${esc(S.memKeyword)}」的记忆<br>
      <span style="font-size:11.5px">共 ${items.length} 条，清空筛选可全部显示</span></div>`;
    return;
  }

  box.innerHTML = shown.map(it => {
    const idx = it.index;
    const raw = String(it.content == null ? "" : it.content);
    let txt = esc(raw);
    if (kw) {
      // 在「已转义」的文本上做高亮：先找出原文中命中区间，
      // 再按转义后的长度映射会出错，所以改为对转义结果做不区分大小写的字面替换。
      const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      txt = txt.replace(re, m => `<span class="mem-hl">${m}</span>`);
    }
    return `<div class="mem-item" data-mem-idx="${idx}">
      <div class="mem-idx" title="索引 ${idx}">${idx}</div>
      <div class="mem-txt">${txt}</div>
      <div class="mem-acts">
        <button class="btn btn-sm" data-mem-edit="${idx}">编辑</button>
        <button class="btn btn-sm" data-mem-del="${idx}">删除</button>
      </div>
    </div>`;
  }).join("");

  box.querySelectorAll("[data-mem-edit]").forEach(b => {
    b.addEventListener("click", () => openMemEdit(Number(b.dataset.memEdit)));
  });
  box.querySelectorAll("[data-mem-del]").forEach(b => {
    b.addEventListener("click", () => delMemItem(Number(b.dataset.memDel)));
  });
}

/* 取当前层级可用的写操作参数（未选目标时给出提示并返回 null） */
function memWriteCtx() {
  const lv = S.memLevel;
  const ident = memIdentOf(lv);
  if (!ident) {
    toast(`请先选择${lv === "group" ? "群" : "用户"}`, "warn");
    return null;
  }
  return { level: lv, identifier: ident };
}

function openMemAdd() {
  const c = memWriteCtx();
  if (!c) return;
  openModal(`添加记忆 · ${memLevelMeta(c.level).label}`, `
    <div class="field">
      <label class="label">记忆内容</label>
      <textarea id="memNew" class="inp" rows="4"
        placeholder="例：张三(1234567) 是群管理员，负责审核入群"></textarea>
      <div class="field-hint">
        涉及用户时建议写成「昵称(QQ号) 事实」，与机器人整理记忆的格式保持一致。
        内容会追加到「${esc(memTargetLabel(c.level, c.identifier))}」。
      </div>
    </div>`, async () => {
    const txt = $("memNew").value.trim();
    if (!txt) { toast("请填写记忆内容", "warn"); return false; }
    try {
      await api(withBot("/api/memory/add"), {
        method: "POST", body: { level: c.level, identifier: c.identifier, content: txt }
      });
      toast("已添加记忆", "ok");
      await loadMemList();
    } catch (e) { toast(e.message, "err"); return false; }
  }, "添加");
}

function openMemEdit(idx) {
  const c = memWriteCtx();
  if (!c) return;
  const it = (window.__memItems || []).find(x => x.index === idx);
  const cur = it ? String(it.content || "") : "";
  openModal(`编辑记忆 #${idx}`, `
    <div class="field">
      <label class="label">记忆内容</label>
      <textarea id="memEdit" class="inp" rows="4">${esc(cur)}</textarea>
      <div class="field-hint">将替换「${esc(memTargetLabel(c.level, c.identifier))}」中索引 ${idx} 的那一条。</div>
    </div>`, async () => {
    const txt = $("memEdit").value.trim();
    if (!txt) { toast("记忆内容不能为空", "warn"); return false; }
    try {
      await api(withBot("/api/memory/update"), {
        method: "POST",
        body: { level: c.level, identifier: c.identifier, index: idx, content: txt }
      });
      toast("已修改", "ok");
      await loadMemList();
    } catch (e) { toast(e.message, "err"); return false; }
  }, "保存");
}

async function delMemItem(idx) {
  const c = memWriteCtx();
  if (!c) return;
  const it = (window.__memItems || []).find(x => x.index === idx);
  const preview = it ? shortId(String(it.content || ""), 60) : "";
  /* 删除不可撤销，用确认弹窗而不是 toast+自动执行。
     先展示将被删除的内容，避免用户凭索引猜错条目。 */
  openModal(`删除记忆 #${idx}`, `
    <div style="font-size:13px;line-height:1.7">确定要删除下面这条记忆吗？此操作不可撤销。</div>
    <div class="card" style="margin-top:11px"><div class="card-bd">
      <div style="font-size:12.5px;line-height:1.6;word-break:break-word">${esc(preview)}</div>
    </div></div>`, async () => {
    try {
      await api(withBot("/api/memory/delete"), {
        method: "POST", body: { level: c.level, identifier: c.identifier, index: idx }
      });
      toast("已删除", "ok");
      await loadMemList();
    } catch (e) { toast(e.message, "err"); return false; }
  }, "删除");
}

async function toggleMemLevel() {
  const c = memWriteCtx();
  if (!c) return;
  const on = !!window.__memEnabled;
  try {
    await api(withBot("/api/memory/toggle"), {
      method: "POST",
      body: { level: c.level, identifier: c.identifier, enabled: !on }
    });
    toast(on ? "已禁用该层级记忆" : "已启用该层级记忆", "ok");
    await loadMemList();
  } catch (e) { toast(e.message, "err"); }
}

/* 批量添加：一行一条。行格式 level|identifier|content，
   level 省略时用当前层级与当前目标；identifier 省略时用当前目标。
   解析失败的行会被明确指出，不会静默丢弃。 */
function openMemBatch() {
  const c = memWriteCtx();
  if (!c) return;
  openModal("批量添加记忆", `
    <div class="field">
      <label class="label">每行一条</label>
      <textarea id="memBatch" class="inp mono" rows="7"
        placeholder="张三(1234567) 是群主&#10;李四(7654321) 爱发图"></textarea>
      <div class="field-hint">
        默认写入当前层级（${esc(memLevelMeta(c.level).label)} ·
        ${esc(memTargetLabel(c.level, c.identifier))}）。<br>
        如需一次写入不同目标，用 <span class="mono">层级|标识符|内容</span> 的格式，
        例如 <span class="mono">group|群openid|群规：禁止广告</span>；
        层级可写 global/bot/group/c2c。
      </div>
    </div>`, async () => {
    const raw = $("memBatch").value;
    const lines = raw.split("\n").map(s => s.trim()).filter(Boolean);
    if (!lines.length) { toast("请至少填写一条", "warn"); return false; }

    const items = [];
    for (const line of lines) {
      const parts = line.split("|").map(s => s.trim());
      if (parts.length >= 3) {
        items.push({ level: parts[0], identifier: parts[1], content: parts.slice(2).join("|") });
      } else {
        items.push({ level: c.level, identifier: c.identifier, content: line });
      }
    }
    try {
      const r = await api(withBot("/api/memory/add"), { method: "POST", body: { items } });
      const d = r.data || {};
      const okN = d.success_count || 0;
      const failN = d.failed_count || 0;
      if (failN) {
        const first = (d.failed && d.failed[0]) || {};
        toast(`成功 ${okN} 条，失败 ${failN} 条` +
          (first.error ? `：第 ${Number(first.index) + 1} 行 ${first.error}` : ""),
          "warn", 6000);
      } else {
        toast(`已添加 ${okN} 条记忆`, "ok");
      }
      await loadMemList();
    } catch (e) { toast(e.message, "err"); return false; }
  }, "添加");
}

/* 跨层搜索：默认搜全部层级，结果按层级分组展示。
   group/c2c 需要目标，这里用当前已选的目标（未选则只搜 global/bot）。 */
function openMemSearch() {
  const gid = S.memLevel === "group" ? (S.memIdent || "") : "";
  const uid = S.memLevel === "c2c" ? (S.memIdent || "") : "";
  openModal("跨层搜索记忆", `
    <div class="field">
      <label class="label">关键词</label>
      <input id="memSearchKw" class="inp" placeholder="多个关键词用逗号分隔，命中任意一个即返回">
    </div>
    <div class="field">
      <label class="label">范围</label>
      <select id="memSearchLv" class="inp">
        <option value="all">全部层级</option>
        ${MEM_LEVELS.map(l => `<option value="${l.v}">${esc(l.label)}</option>`).join("")}
      </select>
      <div class="field-hint" id="memSearchHint">
        ${gid || uid
          ? `群聊/私聊层将使用当前已选目标：<span class="mono">${esc(shortId(gid || uid, 30))}</span>`
          : "尚未选择群/用户，全部层级搜索只会覆盖全局与机器人记忆。"}
      </div>
    </div>
    <div id="memSearchOut"></div>`, async () => {
    await runMemSearch(gid, uid);
    return false;      // 保留弹窗以便连续搜索；用户点 ✕ 关闭
  }, "搜索");

  $("memSearchKw").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); runMemSearch(gid, uid); }
  });
  $("memSearchKw").focus();
}

async function runMemSearch(gid, uid) {
  const kw = $("memSearchKw").value.trim();
  const lv = $("memSearchLv").value;
  const out = $("memSearchOut");
  if (!kw) { toast("请输入关键词", "warn"); return; }

  out.innerHTML = '<div class="loading-row"><span class="spinner"></span>搜索中…</div>';
  const qs = new URLSearchParams({ keywords: kw, level: lv });
  if (gid) qs.set("group_id", gid);
  if (uid) qs.set("c2c_user_id", uid);
  try {
    const r = await api(withBot("/api/memory/search?" + qs.toString()));
    const d = r.data || {};
    const ms = d.matches || [];
    if (!ms.length) {
      out.innerHTML = `<div class="empty" style="padding:22px">
        <div class="empty-ico">🔍</div>没有匹配「${esc(kw)}」的记忆</div>`;
      return;
    }
    // 按层级分组，便于一眼看出命中来自哪一层
    const byLv = {};
    ms.forEach(m => { (byLv[m.level] = byLv[m.level] || []).push(m); });
    out.innerHTML = `<div style="margin-top:12px;font-size:12.5px;color:var(--ink-3)">
        命中 ${d.total} 条</div>` +
      Object.keys(byLv).map(k => `
        <div style="margin-top:11px">
          <div style="font-size:12.5px;font-weight:700;margin-bottom:7px">${memLevelMeta(k).ico} ${esc(memLevelMeta(k).label)}（${byLv[k].length}）</div>
          ${byLv[k].map(m => `<div class="mem-item">
            <div class="mem-idx">${m.index}</div>
            <div class="mem-txt">${esc(m.content)}</div>
            <div class="mem-acts"><span class="mem-badge${m.enabled ? "" : " off"}">
              ${m.enabled ? "启用" : "禁用"}</span></div>
          </div>`).join("")}
        </div>`).join("");
  } catch (e) {
    out.innerHTML = `<div class="empty" style="padding:22px">${esc(e.message)}</div>`;
  }
}

/* ============================================================
   13. 模态框
   ============================================================ */
let modalOnOk = null;
// 弹窗切换标记：回调里再次调用 openModal 时置位，避免旧回调把新弹窗关掉
let modalSwitching = false;

function openModal(title, bodyHTML, onOk, okLabel) {
  $("mTitle").textContent = title;
  $("mBody").innerHTML = bodyHTML;
  modalOnOk = onOk || null;
  $("mFoot").innerHTML = `
    ${onOk ? '<button class="btn" data-m="cancel">取消</button>' : ""}
    <button class="btn btn-primary" data-m="ok">${esc(okLabel || "确定")}</button>`;
  $("mFoot").querySelector('[data-m="ok"]').addEventListener("click", async () => {
    if (!modalOnOk) { closeModal(); return; }
    const keep = await modalOnOk();
    // 回调返回 false 时保留弹窗；但若回调期间已切换到新弹窗
    // （例如「批量撤回」从预览进入确认步骤），则不要关闭它。
    if (modalSwitching) { modalSwitching = false; return; }
    if (keep !== false) closeModal();
  });
  const cancel = $("mFoot").querySelector('[data-m="cancel"]');
  if (cancel) cancel.addEventListener("click", closeModal);
  $("mask").classList.add("open");
  modalSwitching = false;
}

function closeModal() {
  $("mask").classList.remove("open");
  modalOnOk = null;
  $("mBody").innerHTML = "";
  $("mFoot").innerHTML = "";
}

/* ============================================================
   14. 轮询
   ============================================================ */
const CHAT_POLL_MS = 20000;   // 聊天内容自动刷新间隔

function startPolling() {
  stopPolling();
  S.pollTimer = setInterval(() => {
    if (document.hidden) return;
    // 正在请求中就不叠加，避免请求堆积与界面反复闪烁
    if (S.busy) return;
    // 轮询一律走静默刷新：不显示 loading、不打断滚动、不重建 DOM
    if (S.view === "push") loadTaskPane("push", { silent: true });
    else if (S.view === "wakeup") loadTaskPane("wakeup", { silent: true });
  }, 30000);
  startChatPolling();
}

/* 聊天内容定期自动刷新：拉取后走差分渲染，内容没变就不动 DOM，
   有变化也只替换变化的那几条，滚动位置原样保留。 */
function startChatPolling() {
  stopChatPolling();
  S.chatTimer = setInterval(() => {
    if (document.hidden) return;          // 页面在后台不请求
    if (S.view !== "chats" || !S.conv) return;
    if (S.histLoading) return;            // 上一次还没回来，不叠加请求
    if ($("mask").classList.contains("open")) return;  // 弹窗操作中不打扰
    loadHistory(true, true);              // silent + quiet：无感
  }, CHAT_POLL_MS);
  // 回到前台时立刻补一次，避免切回来要等一整个周期
  document.addEventListener("visibilitychange", onVisibilityChange);
}

function stopChatPolling() {
  if (S.chatTimer) { clearInterval(S.chatTimer); S.chatTimer = null; }
}

function onVisibilityChange() {
  if (document.hidden) return;
  if (S.chatTimer && S.view === "chats" && S.conv && !S.histLoading) {
    loadHistory(true, true);
  }
}

function stopPolling() {
  if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
  stopChatPolling();
}

/* ============================================================
   15. 事件绑定 & 启动
   ============================================================ */
function bindEvents() {
  // 登录
  $("lgBtn").addEventListener("click", () => doLogin());
  $("lgKey").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("lgBase").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  // 已登录服务器列表：点击条目直接登录，点 ✕ 移除
  $("lgSaved").addEventListener("click", e => {
    const del = e.target.closest("[data-srv-del]");
    if (del) {
      e.stopPropagation();
      const b = attrDecode(del.dataset.srvDel);
      if (confirm("从列表中移除该服务器？\n\n" + b)) {
        forgetServer(b);
        renderSavedServers();
        fillServerSelector();
      }
      return;
    }
    const item = e.target.closest("[data-srv]");
    if (item) loginSaved(attrDecode(item.dataset.srv));
  });
  // 输入地址时同步高亮已保存条目，方便确认当前选的是哪个
  $("lgBase").addEventListener("input", () => {
    const v = normBase($("lgBase").value);
    document.querySelectorAll("#lgSaved .srv").forEach(el => {
      el.classList.toggle("on", normBase(attrDecode(el.dataset.srv)) === v);
    });
  });

  // 顶栏
  $("themeBtn").addEventListener("click", () => {
    applyTheme(LS.theme === "dark" ? "light" : "dark");
  });
  $("refreshBtn").addEventListener("click", refreshAll);
  $("logoutBtn").addEventListener("click", () => {
    if (confirm("确定退出登录？")) logout();
  });
  // 多目标登录：切换服务器
  $("srvSel").addEventListener("change", e => switchServer(e.target.value));
  $("botSel").addEventListener("change", async e => {
    S.botId = e.target.value;
    LS.bot = S.botId;
    // 记住「这个服务器上选的机器人」，下次切回来仍是它
    rememberServer(S.base, S.key, S.botId);
    S.conv = null;
    S.convs = [];
    // 记忆视图的群/用户下拉是按机器人拉取的，必须跟着换
    resetMemSelection();
    await refreshAll();
  });
  $("menuBtn").addEventListener("click", () => {
    const side = $("sidebar");
    const willShow = side.classList.contains("hidden");
    side.classList.toggle("hidden");
    // 展开侧栏时把主区让开；收起时恢复主区
    $("main").classList.toggle("hidden", willShow);
    syncChrome();
  });
  /* 返回按钮的语义（窄屏与宽屏统一）：
     「返回」只做「退一层」，绝不切换标签页。
       1. 聊天视图且打开了会话  → 回会话列表
       2. 机器人/配置 且主区显示 → 回该视图的选择器（换机器人/换范围）
       3. 推送/唤醒 等无侧栏视图，已经在顶层 → 无事可做，不能跳去聊天
     旧实现在情形 3 会 setView("chats")，导致点「返回」莫名其妙跳到聊天页。 */
  $("backBtn").addEventListener("click", () => {
    if (S.view === "chats") {
      if ($("main").classList.contains("hidden")) return;   // 已在列表，无上一层
      // 回到会话列表：要连同头部的群操作栏一起收掉，
      // 否则上一会话的「发送/群信息/禁言/批量撤回」会残留在列表页
      closeChat();
      $("sidebar").classList.remove("hidden");
      $("main").classList.add("hidden");
      syncChrome();
      return;
    }
    if (S.view === "bots" || S.view === "config" || S.view === "memory") {
      // 这三种视图的侧栏是选择器：收起主区即回到选择器
      $("sidebar").classList.remove("hidden");
      $("main").classList.add("hidden");
      syncChrome();
      return;
    }
    // 推送 / 唤醒：内容本身就是顶层，没有上一层可退。
    // 保持当前页面不动，避免「返回」被误解为「回聊天」。
  });

  // 移动端抽屉遮罩：点空白处收起侧栏。
  // 机器人/配置 视图里侧栏是选择器，收起后必须把主区露出来，
  // 否则两个区域都藏着，用户会看到一片空白。
  $("scrim").addEventListener("click", () => {
    $("sidebar").classList.add("hidden");
    $("main").classList.remove("hidden");
    syncChrome();
  });

  // 导航（底部 tabbar + 桌面 rail）
  document.querySelectorAll(".tabbar button, .nav-rail .nav-btn").forEach(b => {
    b.addEventListener("click", () => setView(b.dataset.nav));
  });

  // 侧栏搜索
  $("sideSearch").addEventListener("input", () => {
    if (S.view === "chats") renderConvList();
  });

  // 会话列表点击（事件委托）
  $("sideBody").addEventListener("click", e => {
    const el = e.target.closest(".conv[data-type]");
    if (el) openConv(el.dataset.type, attrDecode(el.dataset.id));
  });

  // 主区按钮（事件委托，含头部菜单项）
  $("mainActs").addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const a = b.dataset.act;
    closeChMenu();
    if (a === "focus") $("taMsg").focus();
    else if (a === "members") openMembersPanel();
    else if (a === "mute") openMutePanel();
    else if (a === "botstate") openBotState();
    else if (a === "ginfo") openGroupInfo();
    else if (a === "batch") openBatchRevoke();
    else if (a === "sendmedia") openMediaModal();
    else if (a === "reload") loadHistory();
    else if (a === "chmenu") toggleChMenu();
  });
  // 点击空白处关闭头部菜单
  document.addEventListener("click", e => {
    if (!e.target.closest(".ch-menu-wrap")) closeChMenu();
  });

  // 输入框
  const ta = $("taMsg");
  ta.addEventListener("input", () => autoGrow(ta));
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendText(); }
  });
  $("btnSend").addEventListener("click", sendText);
  $("chipMd").addEventListener("click", toggleMdMode);
  $("chipWake").addEventListener("click", toggleWakeMode);
  $("chipWakeIso").addEventListener("click", toggleWakeIso);
  $("chipMedia").addEventListener("click", openMediaModal);

  // 模态框遮罩点击关闭
  $("mask").addEventListener("click", e => { if (e.target === $("mask")) closeModal(); });

  // 图片查看
  $("lightbox").addEventListener("click", () => $("lightbox").classList.remove("open"));

  // 键盘
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if ($("lightbox").classList.contains("open")) $("lightbox").classList.remove("open");
      else if ($("mask").classList.contains("open")) closeModal();
      else closeChMenu();
    }
  });

  // 窗口尺寸
  window.addEventListener("resize", () => {
    const m = isMobileNow();
    if (m !== S.mobile) {
      S.mobile = m;
      // 宽度变化后重新套用当前视图的侧栏规则（推送/唤醒 在宽屏要收起侧栏）
      const noSide = S.view === "push" || S.view === "wakeup";
      document.body.classList.toggle("no-side", noSide && !m);
      if (!m) {
        $("sidebar").classList.remove("hidden");
        $("main").classList.remove("hidden");
      } else if (S.view === "chats") {
        $("sidebar").classList.remove("hidden");
        $("main").classList.add("hidden");
      }
    }
    syncChrome();               // 跨过断点时遮罩状态也要跟着重算
  });
}

/* ============================================================
   15. 移动端交互：手势、软键盘、返回键
   ------------------------------------------------------------
   这一层只在窄屏生效，桌面端不注册任何监听，行为与 2.0 完全一致。
   ============================================================ */

/* ---- 软键盘适配 ----
   安卓/iOS 弹出键盘时，100vh 不会缩短，底部输入框会被键盘盖住。
   用 visualViewport 把实际可视高度写进 --vvh，
   .composer 与 .main 据此收紧，键盘弹起时输入框始终贴着键盘上沿。
   不支持 visualViewport 的老浏览器自动跳过，退化为原行为。 */
function initKeyboardViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const apply = () => {
    const h = Math.round(vv.height);
    document.documentElement.style.setProperty("--vvh", h + "px");
    // 键盘是否弹起：可视高度显著小于窗口高度（阈值避免地址栏收缩误判）
    const kb = (window.innerHeight - h) > 130;
    document.body.classList.toggle("kb-open", kb);
    // 键盘弹起时把消息区滚到底，避免最新消息被遮住
    if (kb && S.view === "chats" && S.conv) {
      requestAnimationFrame(() => {
        const body = $("mainBody");
        if (body) body.scrollTop = body.scrollHeight;
      });
    }
  };
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
  apply();
}

/* ---- 边缘侧滑返回 ----
   在屏幕左缘起手向右滑 → 收起主区回到会话列表（等价于「返回」按钮）。
   只在聊天视图生效，且必须从左边缘开始，避免和消息区横向滚动打架。 */
function initSwipeBack() {
  const EDGE = 36;        // 起手必须落在左边缘 36px 内
  const TRIGGER = 64;     // 右滑超过 64px 才判定为返回
  let sx = 0, sy = 0, tracking = false, decided = false, active = false;

  document.addEventListener("touchstart", e => {
    if (!isMobileNow() || e.touches.length !== 1) return;
    // 聊天视图、且主区正显示时才有「返回」可退
    if (S.view !== "chats" || $("main").classList.contains("hidden")) return;
    // 弹窗/图片查看打开时不拦截手势
    if ($("mask").classList.contains("open")) return;
    if ($("lightbox").classList.contains("open")) return;
    const t = e.touches[0];
    if (t.clientX > EDGE) return;
    sx = t.clientX; sy = t.clientY;
    tracking = true; decided = false; active = false;
  }, { passive: true });

  document.addEventListener("touchmove", e => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (!decided) {
      // 首次移动就判定方向：竖直优先让给滚动，避免误触返回
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      decided = true;
      if (Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
      active = true;
    }
    if (!active) return;
    // 跟手位移：主区随手指右移，给用户明确的「正在返回」反馈
    if (dx > 0 && dx < window.innerWidth) {
      const main = $("main");
      main.style.transform = `translateX(${dx}px)`;
    }
  }, { passive: true });

  const finish = e => {
    if (!tracking) return;
    const main = $("main");
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const dx = t ? t.clientX - sx : 0;
    const wasActive = active;
    tracking = false; active = false; decided = false;
    main.style.transform = "";           // 交还给 CSS 过渡做收尾动画
    if (wasActive && dx > TRIGGER) $("backBtn").click();
  };
  document.addEventListener("touchend", finish, { passive: true });
  document.addEventListener("touchcancel", finish, { passive: true });
}

/* ---- 侧栏抽屉：右滑关闭 ----
   侧栏在窄屏是整屏抽屉，习惯上应该能右滑收起（和返回手势方向一致）。 */
function initDrawerSwipe() {
  const side = $("sidebar");
  let sx = 0, tracking = false;
  side.addEventListener("touchstart", e => {
    if (!isMobileNow() || e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    tracking = true;
  }, { passive: true });
  side.addEventListener("touchmove", e => {
    if (!tracking) return;
    const dx = e.touches[0].clientX - sx;
    if (dx > 12) side.style.transform = `translateX(${Math.min(dx, window.innerWidth)}px)`;
  }, { passive: true });
  const end = e => {
    if (!tracking) return;
    tracking = false;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const dx = t ? t.clientX - sx : 0;
    side.style.transform = "";
    if (dx > 60) { side.classList.add("hidden"); syncChrome(); }
  };
  side.addEventListener("touchend", end, { passive: true });
  side.addEventListener("touchcancel", end, { passive: true });
}

/* ---- 安卓返回键 / 浏览器后退 ----
   移动端最自然的「返回」是系统返回键。用 history 记录一层虚拟状态：
   打开会话/切视图时压入，按返回键时先回退界面而不是直接退出页面。 */
function initHistoryBack() {
  if (!isMobileNow()) return;
  history.replaceState({ dsh: "root" }, "");
  window.addEventListener("popstate", () => {
    if (!isMobileNow()) return;
    // 优先关掉最上层的浮层
    if ($("lightbox").classList.contains("open")) {
      $("lightbox").classList.remove("open");
      history.pushState({ dsh: "root" }, "");
      return;
    }
    if ($("mask").classList.contains("open")) {
      closeModal();
      history.pushState({ dsh: "root" }, "");
      return;
    }
    // 会话打开着 → 回到列表
    if (S.view === "chats" && !$("main").classList.contains("hidden")) {
      $("backBtn").click();
      history.pushState({ dsh: "root" }, "");
      return;
    }
    // 机器人/配置：主区显示时，返回键回到选择器（与返回按钮一致）
    if ((S.view === "bots" || S.view === "config")
        && $("sidebar").classList.contains("hidden")) {
      $("backBtn").click();
      history.pushState({ dsh: "root" }, "");
      return;
    }
    // 其余情况（已在列表页/推送/唤醒顶层）：不再劫持返回键，
    // 交给浏览器正常后退，避免「返回」被误解成切换标签页。
    history.back();
  });
}

/* ---- 双击顶栏回到顶部 ----
   长列表里快速回顶是移动端高频操作。 */
function initDoubleTapTop() {
  document.querySelectorAll(".main-body").forEach(el => {
    let last = 0;
    el.addEventListener("touchend", () => {
      if (!isMobileNow()) return;
      const now = Date.now();
      if (now - last < 300) {
        el.scrollTo({ top: 0, behavior: "smooth" });
        last = 0;
      } else last = now;
    }, { passive: true });
  });
}

function initMobileUX() {
  initKeyboardViewport();
  initSwipeBack();
  initDrawerSwipe();
  initHistoryBack();
  initDoubleTapTop();
  // 进入时先同步一次遮罩状态（S.mobile 在脚本顶部已算好）
  syncChrome();
  // 触屏上地址栏收缩会改变可视高度，导致 --vvh 需要重算
  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      const vv = window.visualViewport;
      if (vv) document.documentElement.style.setProperty("--vvh", Math.round(vv.height) + "px");
      syncChrome();
    }, 260);
  });
}

async function boot() {
  bindEvents();
  bindHistBar();             // 头部搜索/筛选条只需绑定一次
  initMobileUX();            // 3.0：手势、软键盘、返回键（窄屏生效）
  applyTheme(LS.theme);
  S.mdMode = LS.mdMode;      // 恢复上次的 Markdown 偏好
  syncComposerUI();

  // 登录页：回填上次的目标，并列出所有已登录过的服务器
  const base = normBase(LS.base) || defaultBase();
  $("lgBase").value = base;
  $("lgKey").value = LS.key || "";
  renderSavedServers();
  fillServerSelector();

  // 自动重连：只要记得地址就尝试一次（密钥可以为空 → 无密钥登录）。
  // 之前只在「有密钥」时才自动进入，导致无密钥服务器每次都要手点登录。
  if (base) {
    const res = await probeTarget(base, LS.key || "");
    if (res.ok) {
      S.base = base; S.key = LS.key || "";
      S.bots = res.bots;
      rememberServer(base, LS.key || "", LS.bot || "");
      await enterApp();
      startPolling();
      return;
    }
    // 需要密钥才提示，其它错误留给用户手点登录时再看
    if (res.needKey) setLoginErr(res.msg);
  }
  $("login").style.display = "flex";
}

document.addEventListener("DOMContentLoaded", boot);
</script>
